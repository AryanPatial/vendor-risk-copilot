[project]
name = "qre"
version = "0.1.0"
description = "Drafts answers to security questionnaires from a company's past responses and policy documents."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "sentence-transformers>=3.3",
    "openai>=1.57",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
qre = "qre.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qre"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["needs_db: requires a running Postgres with pgvector"]

[tool.mypy]
python_version = "3.13"
packages = ["qre"]
mypy_path = "src"
warn_unused_ignores = true
